server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:tls/server-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.trust-store=classpath:tls/server-truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.client-auth=need

logging.level.root=INFO
logging.level.com.projectwork=DEBUG
logging.file.name=logs/crypto-service.log

master.keystore.password=${MASTER_KEYSTORE_PASSWORD}
master.keystore.path=${MASTER_KEYSTORE_PATH}

client.keystore.password=${CLIENT_KEYSTORE_PASSWORD}
client.keystore.path=${CLIENT_KEYSTORE_PATH}
server.port=8443

# SCPs:
# - [143] Implement encryption for the transmission of all sensitive information
# - [144] TLS certificates should be valid and have the correct domain name, not be expired, and be installed with intermediate certificates when required --> see mtls files and mtls readme file
# - [145] Failed TLS connections should not fall back to an insecure connection --> spring boot standard config
# - [146] Utilize TLS for all authenticated access and all other sensitive information --> all endpoints are accessable just over mtls
server.ssl.enabled=true
server.ssl.key-store=classpath:tls/server-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.trust-store=classpath:tls/server-truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.client-auth=need

logging.level.root=INFO
logging.level.com.projectwork=DEBUG
logging.file.name=logs/crypto-service.log

master.keystore.password=${MASTER_KEYSTORE_PASSWORD}
master.keystore.path=${MASTER_KEYSTORE_PATH}

client.keystore.password=${CLIENT_KEYSTORE_PASSWORD}
client.keystore.path=${CLIENT_KEYSTORE_PATH}